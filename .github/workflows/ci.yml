name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Une seule exécution CI par branche : annule la précédente si un nouveau push
# arrive, plutôt que de la mettre en file derrière un build déjà obsolète.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # Les tests sont répartis sur plusieurs jobs exécutés EN PARALLÈLE (shards
  # Jest) au lieu d'un seul job séquentiel : la durée totale est divisée par le
  # nombre de shards. fail-fast désactivé pour voir tous les échecs d'un coup.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --runInBand : les 3 jobs restent parallèles entre eux, mais les fichiers
      # de test d'un même shard sont exécutés en série. Indispensable ici : tous
      # les tests partagent une base SQLite unique (data/edukora.db), et un
      # parallélisme intra-job provoquait des courses (migrations/seed).
      - name: Tests (shard ${{ matrix.shard }}/3)
        run: npx jest --forceExit --runInBand --shard=${{ matrix.shard }}/3

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_DIST_DIR: .next
